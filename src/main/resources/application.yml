langchain4j:
  open-ai:
    # 非流式模型：query 改写用（把中文问题转成英文检索词）。
    # 温度压 0，要的是稳定的词不是发挥；推理必须关——开着会先想几十秒，
    # 实测不改这一项 P50 就要 7 秒、最长 132 秒。
    chat-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.8-flash
      temperature: 0
      reasoning-effort: none
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.8-flash
      temperature: 0.3
      reasoning-effort: none  # ????
      log-requests: true    # ??
      log-responses: true   # ??
    # ????
    embedding-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-text-embedding-flash
logging:
  level:
    com.springragforge: debug

server:
  port: 8099
  tomcat:
    max-http-form-post-size: 1GB

spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      lettuce:
        pool:
          max-active: 8 # ????
          max-idle: 8   # ??????
          min-idle: 0   # ??????
          max-wait: 100 # ??????

rag:
  ingest:
    # 语料根目录。下面一层目录是语料源，目前支持 spring-framework / spring-boot / spring-ai。
    # 灌库按这个根扫全部 .adoc，根之外的 adoc 换不出跳转链接，会被跳过。
    corpus-root: E:/springDoc/corpus
    # 向量库落盘位置，启动时从这里加载
    store-file: data/embedding-store.json
    # 灌库清单，增量比对靠它；删了就等于全量重建
    manifest-file: data/ingest-manifest.json
    # ES 向量索引名，建索引和检索共用同一个
    index-name: rag_knowledge
    # dense_vector 维度，必须等于 embedding 模型输出维度；换模型要同步改并重建索引
    dimension: 1024

  # 混合检索：BM25 + KNN 双路召回，RRF 融合
  retrieval:
    # 两路各自的候选池大小（融合前），不是最终返回数
    # BM25 吃的是改写后的英文关键词串，所以这里恢复非 0，否则那一路白接
    bm25-top-k: 20
    knn-top-k: 20
    # KNN 参与近邻计算的候选数，越大越准越慢，必须 >= knn-top-k
    knn-num-candidates: 100
    # RRF 公式里的 k，默认 60；越大越削弱头部排名影响
    rrf-k: 20
    # 融合后最终交给模型的片段数
    max-results: 5
    # 是否把中文问题改写成英文检索词再走 BM25。关掉即老行为，用于对照评测。
    rewrite-enabled: true
langchain4j:
  open-ai:
    # 非流式模型：query 改写、指代消解、滚动摘要共用。
    # 温度压 0，要的是稳定的词不是发挥；推理必须关——开着会先想几十秒，
    # 实测不改这一项 P50 就要 7 秒、最长 132 秒。
    chat-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: deepseek-v4.1-flash
      temperature: 0
      reasoning-effort: none
      # 输出硬上限：摘要提示词要求 300 字，但模型可能无视；这里从 API 层兜底
      max-tokens: 400
      # 非流式这条路没有应用层韧性包裹，靠模型自带超时兜底（改写挂了 QueryRewriter 会退回原问题）
      timeout: 10s
      max-retries: 2
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: deepseek-v4.1-flash
      temperature: 0
      reasoning-effort: none  # ????
      log-requests: true    # ??
      log-responses: true   # ??
      # 流式响应默认不带 token usage。手动要求 OpenAI 兼容接口在最后一块补上
      # （langchain4j 1.18.1 自己不发 include_usage）。若接口不认 stream_options 而报 400，
      # 把下面两行删掉即可，代价是流式这条路的用量统计不到。
      custom-parameters:
        stream_options:
          include_usage: true
    # ????
    embedding-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-text-embedding-flash
      # 检索路径同样没有应用层韧性包裹，超时/重试由模型自带
      timeout: 10s
      max-retries: 2
logging:
  level:
    com.springragforge: debug

server:
  port: 8099
  tomcat:
    max-http-form-post-size: 1GB

spring:
  servlet:
    multipart:
      # 上传接口的文件大小上限，默认只有 1MB 会直接拒掉文档
      max-file-size: 100MB
      max-request-size: 1GB
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      lettuce:
        pool:
          max-active: 8 # ????
          max-idle: 8   # ??????
          min-idle: 0   # ??????
          max-wait: 100 # ??????

  # QQ 邮箱 SMTP。注意 password 不是 QQ 登录密码，而是 QQ 邮箱「设置 → 账户 →
  # POP3/SMTP 服务」里开启后生成的「授权码」。本地跑请配环境变量：
  #   SPRING_MAIL_USERNAME=你的@qq.com
  #   SPRING_MAIL_PASSWORD=授权码
  mail:
    host: smtp.qq.com
    port: 465
    protocol: smtps
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

  # MySQL 用户表。建一个空库 rag_forge，Hibernate 会按 entity 自动建/改表
  # （ddl-auto: update）。本地跑请配环境变量：
  #   MYSQL_USERNAME=root
  #   MYSQL_PASSWORD=你的密码
  datasource:
    url: jdbc:mysql://localhost:3306/rag?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# MinIO 对象存储。endpoint 必须是 S3 API 地址：
# http://192.168.16.128:9001/browser/rag-docs 是控制台（9001），
# S3 API 默认在 9000；若部署时改过端口，把下面 endpoint 换成实际 API 端口。
minio:
  endpoint: http://192.168.16.128:9000
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:12345678}
  bucket: rag-docs

rag:
  ingest:
    # 语料存储方式：minio（默认，从 rag-docs bucket 读）/ local（本地磁盘）
    storage: minio
    # MinIO 模式下是虚拟语料根，只参与 chunk_id 前缀换算；
    # 对象 key 相对 bucket 根计算，如 spring-boot/reference/pages/web/servlet.adoc。
    # local 模式下这里要写真实语料根目录。
    corpus-root: rag-docs
    # 向量库落盘位置，启动时从这里加载
    store-file: data/embedding-store.json
    # 灌库清单，增量比对靠它；删了就等于全量重建
    manifest-file: data/ingest-manifest.json
    # ES 向量索引名，建索引和检索共用同一个
    index-name: rag_knowledge
    # dense_vector 维度，必须等于 embedding 模型输出维度；换模型要同步改并重建索引
    dimension: 1024

  # 会话记忆：滚动摘要替代纯滑窗。预算只算「摘要 + 最近消息」，不含 system 提示和检索片段。
  # 涨到高水位才逐出最老的消息，攒够 evict-batch 条做一次增量摘要，一次逐到低水位；摘要计入预算。
  memory:
    # 记忆预算（摘要 + 最近消息），单位 token。提示窗口的硬上限
    budget-tokens: 7000
    # 高水位：占用涨到预算的 95% 才触发逐出 + 摘要，避免贴着预算线每轮都摘一次
    summarize-at-ratio: 0.95
    # 低水位：一次逐到预算的 70%，给后面几轮留余量，少调几次摘要模型
    evict-to-ratio: 0.70
    # 无论怎么逐出，最近这么多条原文永远保留
    keep-recent-messages: 7
    # 一次逐出的条数：攒批再一次 LLM 调用，避免逐一条就调一次
    evict-batch: 2
    # 摘要自身 token 上限（代码侧二次兜底），必须小于 budget-tokens
    summary-max-tokens: 400
    # 连续摘要失败达到该次数后放弃摘要、直接逐出，防止 history 无限增长
    summary-failure-threshold: 2
    # 存储硬上限（摘要 + 历史），0 表示不启用；超限时无视摘要直接丢弃最老消息
    hard-cap-tokens: 18000
    # 消息与摘要共用的 Redis TTL，两者一起刷新
    ttl: 1d

  # 混合检索：BM25 + KNN 双路召回，RRF 融合
  retrieval:
    # 两路各自的候选池大小（融合前），不是最终返回数
    # BM25 吃的是改写后的英文关键词串，所以这里恢复非 0，否则那一路白接
    bm25-top-k: 0
    knn-top-k: 20
    # KNN 参与近邻计算的候选数，越大越准越慢，必须 >= knn-top-k
    knn-num-candidates: 100
    # RRF 公式里的 k，默认 60；越大越削弱头部排名影响
    rrf-k: 20
    # RRF 融合后交给重排器的候选数（重排输入池），必须 >= max-results
    candidate-pool: 20
    # 最终交给模型的片段数（重排后保留数）
    max-results: 5
    # 是否把中文问题改写成英文检索词再走 BM25。关掉即老行为，用于对照评测。
    rewrite-enabled: false

  # 重排：召回之后的精排阶段，cross-encoder 逐条打分再取前 N
  rerank:
    enabled: false # 启动/禁用重排序
    base-url: https://dashscope.aliyuncs.com/api/v1
    api-key: ${DASHSCOPE_API_KEY}
    model-name: qwen3.7-text-rerank
    # 相关性分阈值，低于它的片段丢弃；留空表示不过滤（注意这是 0~1 的 cross-encoder 分）
    min-score: 0.6
    timeout-seconds: 20

  # 生成层韧性：首 token 前可重试（无损），首 token 后只做空闲超时（重试会导致重复内容）
  resilience:
    enabled: true
    # 单次尝试的首 token 超时（t）
    first-token-timeout: 10s
    # 首 token 后逐间隔空闲超时，必须小于 overall-deadline
    idle-timeout: 15s
    # 整轮重试循环硬上限（D）
    overall-deadline: 30s
    # 重试次数，总尝试 = 次数 + 1
    max-retries: 2
    min-backoff: 200ms
    max-backoff: 2s
    jitter: 0.5

  # 限流：最外层，全局单实例。速率闸先拦请求频率，并发闸再控同时在途的流数，超限快速失败
  rate-limit:
    enabled: true
    # 每个刷新周期允许通过的请求数（速率闸）
    limit-for-period: 20
    # 刷新周期长度
    limit-refresh-period: 1s
    # 同时在途请求数上限（并发闸，含整个 SSE 流持续的时间）
    max-concurrent-calls: 10

  # token 用量与成本统计：监听器截模型返回的 usage，Redis 累计，GET /admin/usage 出报表
  usage:
    enabled: true
    # 每次模型调用后打一行用量日志
    log-each-call: true
    # 价格表：按模型名精确匹配，单位「每百万 token」，币种随计费方。
    # 下面的金额是占位 0，按实际资费改；查不到价格的模型只报 token 数、不报金额。
    # 注意：只覆盖 chat / streaming-chat 两个模型，embedding 与自写重排不在内。
    pricing:
      - model-name: qwen3.8-flash
        input-per-million: 0.8
        output-per-million: 2.7
      - model-name: qwen3.7-text-embedding-flash
        input-per-million: 0.5
        output-per-million: 0.0
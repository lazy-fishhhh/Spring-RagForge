langchain4j:
  open-ai:
    # 非流式模型：query 改写用（把中文问题转成英文检索词）。
    # 温度压 0，要的是稳定的词不是发挥；推理必须关——开着会先想几十秒，
    # 实测不改这一项 P50 就要 7 秒、最长 132 秒。
    chat-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.8-flash
      temperature: 0
      reasoning-effort: none
      # 非流式这条路没有应用层韧性包裹，靠模型自带超时兜底（改写挂了 QueryRewriter 会退回原问题）
      timeout: 10s
      max-retries: 2
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.8-flash
      temperature: 0
      reasoning-effort: none  # ????
      log-requests: true    # ??
      log-responses: true   # ??
      # 流式响应默认不带 token usage。手动要求 OpenAI 兼容接口在最后一块补上
      # （langchain4j 1.18.1 自己不发 include_usage）。若接口不认 stream_options 而报 400，
      # 把下面两行删掉即可，代价是流式这条路的用量统计不到。
      custom-parameters:
        stream_options:
          include_usage: true
    # ????
    embedding-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-text-embedding-flash
      # 检索路径同样没有应用层韧性包裹，超时/重试由模型自带
      timeout: 10s
      max-retries: 2
logging:
  level:
    com.springragforge: debug

server:
  port: 8099
  tomcat:
    max-http-form-post-size: 1GB

spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      lettuce:
        pool:
          max-active: 8 # ????
          max-idle: 8   # ??????
          min-idle: 0   # ??????
          max-wait: 100 # ??????

rag:
  ingest:
    # 语料根目录。下面一层目录是语料源，目前支持 spring-framework / spring-boot / spring-ai。
    # 灌库按这个根扫全部 .adoc，根之外的 adoc 换不出跳转链接，会被跳过。
    corpus-root: E:/springDoc/corpus
    # 向量库落盘位置，启动时从这里加载
    store-file: data/embedding-store.json
    # 灌库清单，增量比对靠它；删了就等于全量重建
    manifest-file: data/ingest-manifest.json
    # ES 向量索引名，建索引和检索共用同一个
    index-name: rag_knowledge
    # dense_vector 维度，必须等于 embedding 模型输出维度；换模型要同步改并重建索引
    dimension: 1024

  # 混合检索：BM25 + KNN 双路召回，RRF 融合
  retrieval:
    # 两路各自的候选池大小（融合前），不是最终返回数
    # BM25 吃的是改写后的英文关键词串，所以这里恢复非 0，否则那一路白接
    bm25-top-k: 20
    knn-top-k: 20
    # KNN 参与近邻计算的候选数，越大越准越慢，必须 >= knn-top-k
    knn-num-candidates: 100
    # RRF 公式里的 k，默认 60；越大越削弱头部排名影响
    rrf-k: 20
    # RRF 融合后交给重排器的候选数（重排输入池），必须 >= max-results
    candidate-pool: 20
    # 最终交给模型的片段数（重排后保留数）
    max-results: 5
    # 是否把中文问题改写成英文检索词再走 BM25。关掉即老行为，用于对照评测。
    rewrite-enabled: false

  # 重排：召回之后的精排阶段，cross-encoder 逐条打分再取前 N
  rerank:
    enabled: false # 启动/禁用重排序
    base-url: https://dashscope.aliyuncs.com/api/v1
    api-key: ${DASHSCOPE_API_KEY}
    model-name: qwen3.7-text-rerank
    # 相关性分阈值，低于它的片段丢弃；留空表示不过滤（注意这是 0~1 的 cross-encoder 分）
    # min-score: 0.3
    timeout-seconds: 20

  # 生成层韧性：首 token 前可重试（无损），首 token 后只做空闲超时（重试会导致重复内容）
  resilience:
    enabled: true
    # 单次尝试的首 token 超时（t）
    first-token-timeout: 10s
    # 首 token 后逐间隔空闲超时，必须小于 overall-deadline
    idle-timeout: 15s
    # 整轮重试循环硬上限（D）
    overall-deadline: 30s
    # 重试次数，总尝试 = 次数 + 1
    max-retries: 2
    min-backoff: 200ms
    max-backoff: 2s
    jitter: 0.5

  # 限流：最外层，全局单实例。速率闸先拦请求频率，并发闸再控同时在途的流数，超限快速失败
  rate-limit:
    enabled: true
    # 每个刷新周期允许通过的请求数（速率闸）
    limit-for-period: 20
    # 刷新周期长度
    limit-refresh-period: 1s
    # 同时在途请求数上限（并发闸，含整个 SSE 流持续的时间）
    max-concurrent-calls: 10

  # token 用量与成本统计：监听器截模型返回的 usage，Redis 累计，GET /admin/usage 出报表
  usage:
    enabled: true
    # 每次模型调用后打一行用量日志
    log-each-call: true
    # 价格表：按模型名精确匹配，单位「每百万 token」，币种随计费方。
    # 下面的金额是占位 0，按实际资费改；查不到价格的模型只报 token 数、不报金额。
    # 注意：只覆盖 chat / streaming-chat 两个模型，embedding 与自写重排不在内。
    pricing:
      - model-name: qwen3.8-flash
        input-per-million: 0.8
        output-per-million: 2.7
      - model-name: qwen3.7-text-embedding-flash
        input-per-million: 0.5
        output-per-million: 0.0